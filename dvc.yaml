stages:
  validate:
    cmd: python -m src.data.validate
    deps:
      - src/data/validate.py
      - data/offline/offline.parquet
    outs:
      - reports/validation.json

  split:
    cmd: python -m src.data.split
    deps:
      - src/data/split.py
      - data/offline/offline.parquet
      - reports/validation.json
    params:
      - split
    outs:
      - data/splits

  train:
    cmd: python -m src.models.train
    deps:
      - src/models/train.py
      - src/features
      - data/splits/train.parquet
      - data/splits/val.parquet
    params:
      - features
      - train
      - lgbm
    outs:
      - models/model.txt
      - models/feature_builder.pkl
    metrics:
      - reports/metrics.json:
          cache: false

  evaluate:
    cmd: python -m src.models.evaluate
    deps:
      - src/models/evaluate.py
      - src/features
      - models/model.txt
      - models/feature_builder.pkl
      - data/splits/test.parquet
    params:
      - evaluate
    outs:
      - reports/shap_importance.json
    metrics:
      - reports/test_metrics.json:
          cache: false          

  promote:
    cmd: python -m src.models.promote
    deps:
      - src/models/promote.py
      - models/model.txt
      - models/feature_builder.pkl
      - reports/test_metrics.json
    outs:
      - reports/promotion.json:
          cache: false